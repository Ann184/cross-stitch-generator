<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор схем</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    <header class="header">
        <div class="logo">ГенераторСхем</div>
        <nav>
            <a href="#">Главная</a>
            <a href="#">О сайте</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="card setting-card">
            <h2>Настройки генератора</h2>
            <form id="uploadForm">
                <label for="fileInput">Картинка:</label>
                <div class="file-upload-wrapper">
                    <label for="fileInput" class="custom-file-button">
                        📁 Выбрать файл
                    </label>
                    <input type="file" id="fileInput" name="fileInput" class="hidden-input" required>
                    <span id="fileName">Файл не выбран</span>
                </div>

                <div class="settings-row">
                    <div class="field-group">
                        <label for="width">📏 Ширина:</label>
                        <input type="number" id="width" name="width" value="20" min="5" max="1024">
                    </div>
                    
                    <div class="field-group">
                        <label for="colors">🎨 Цвета:</label>
                        <input type="number" id="colors" name="colors" value="16" min="2" max="256">
                    </div>
                </div>
                
                <button type="button" id="buttonGenerate">
                    <span id="buttonText">Сгенерировать схему</span>
                    <div id="loader" class="hidden spinner"></div>
                </button>
            </form>

            <div class="zoom-controls">
                <button type="button" class="buttonZoom" data-action="in">+</button>
                <button type="button" class="buttonZoom" data-action="out">-</button>
            </div>
        </section>
        
        <section class="card" id="resultContainer">
            <canvas id="gridCanvas"></canvas>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026</p>
        <div class="footer-links">
            <a href="#">Карта сайта</a>
        </div>
    </footer>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>

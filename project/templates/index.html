<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор схем</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #resultContainer { margin-top: 20px; overflow-x: auto; }
        table { border-collapse: collapse; border: 2px solid #333; }
        td { width: 25px; height: 25px; border: 0.5px solid #e0e0e0; padding: 0; }
        form { background: #f4f4f9; padding: 15px; border-radius: 8px; display: inline-block; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h2>Настройки генератора</h2>
    <form id="uploadForm">
        <label>Картинка:</label>
        <input type="file" id="fileInput" name="fileInput" required><br><br>

        <label>Ширина:</label>
        <input type="number" id="width" name="width" value="20" min="5" max="1024"><br><br>
        
        <label>Количество цветов:</label>
        <input type="number" id="colors"name="colors" value="16" min="2" max="256"><br><br>
        
        <button type="button" onclick="generateImage()">Сгенерировать схему</button>
    </form>

    <div id="resultContainer"></div>

    <script src="/static/app-logic.js"></script>
</body>
</html>
